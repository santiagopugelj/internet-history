<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport">
        <link rel="stylesheet" href="css/style.css">
        <link rel="icon" href="favicon/globe.svg">
        <title>Contact</title>
    </head>
    <body>
        <header>
            <a id=link-title href="index.html" title="Internet History"><h1><span id="history-word-title">History</span> of the Internet</h1></a>
            <nav>
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="timeline.html">Timeline</a>
            </nav>
        </header>
        <main>
            <section>
                <fieldset>
                    <legend>Contact form:</legend>
                    <form>
                        <label for="name">Full name:</label> 
                        <input type="text" name="name" id="name" placeholder="e.g., John Doe" minlength="4" required>
                        <br>
                        <label for="email" >Email:</label>
                        <input type="email" id="email" placeholder="e.g., johndoe@mail.com">
                        <br>
                        <label for="user-message">Message:</label>
                        <textarea name="user-message" id="user-message" rows="4" cols="20"></textarea>
                    
                        <button type="submit">Submit</button>
                    </form>
                </fieldset>
            </section>
            <section>
                <address>
                    <h2>internethistory.com</h2>
                    <p>
                        504 Boulevard Street<br>
                        San Francisco, CA<br>
                        United States
                    </p>
                    <p>Phone: <a href="tel:+1222222222">+1 (222) 222-222</a></p>
                    <p>Email: <a href="mailto:internethistory@contact.com"> internethistory@contact.com</a></p>
                </address>
            </section>
        </main>
        <footer>
            <p>&copy; copyright reserved - internethistory.com</p>
            <nav>
                <a class="nav-link" href="contact.html">Contact</a>
            </nav>
        </footer>
    </body>
</html>
